[project]
name = "nga-scraper"
version = "0.1.0"
description = "Scraper for NGA BBS forum posts (bbs.nga.cn) for RAG ingestion"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
]

[project.scripts]
nga-scraper = "nga_scraper.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nga_scraper"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
